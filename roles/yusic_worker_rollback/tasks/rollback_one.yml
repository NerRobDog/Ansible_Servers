---
- name: Restore previous image for worker
  ansible.builtin.shell: |
    set -euo pipefail
    ssh_args=(
      -o StrictHostKeyChecking={{ yusic_worker_ssh_strict_host_key_checking | default('yes') }}
      -o ConnectTimeout={{ yusic_worker_ssh_connect_timeout_seconds | default(15) }}
      -p {{ yusic_worker.ssh.port }}
    )
    if [ -f "{{ yusic_worker_relay_stage_dir | default('/opt/yusic-worker-relay/stage') }}/{{ yusic_worker.alias }}/id_worker" ]; then
      ssh_args+=(-i "{{ yusic_worker_relay_stage_dir | default('/opt/yusic-worker-relay/stage') }}/{{ yusic_worker.alias }}/id_worker")
    fi
    target="{{ yusic_worker.ssh.user }}@{{ yusic_worker.ssh.host }}"
    if [ -n "{{ yusic_worker.ssh.password | default('') }}" ]; then
      SSHPASS="{{ yusic_worker.ssh.password }}" sshpass -e ssh "${ssh_args[@]}" "${target}" <<'EOSH'
    set -euo pipefail
    cd "{{ yusic_worker.workdir }}"
    if [ ! -f yusic-worker.env ]; then
      exit 0
    fi
    if grep -q '^WORKER_IMAGE=' yusic-worker.env; then
      sed -i "s|^WORKER_IMAGE=.*|WORKER_IMAGE={{ (yusic_worker_backup_images | default({})).get(yusic_worker.alias, '') }}|" yusic-worker.env
    else
      printf '%s\n' "WORKER_IMAGE={{ (yusic_worker_backup_images | default({})).get(yusic_worker.alias, '') }}" >> yusic-worker.env
    fi
    docker compose --env-file yusic-worker.env -f docker-compose.yml up -d
    echo "__ROLLBACK_APPLIED__"
    EOSH
    else
      ssh "${ssh_args[@]}" "${target}" <<'EOSH'
    set -euo pipefail
    cd "{{ yusic_worker.workdir }}"
    if [ ! -f yusic-worker.env ]; then
      exit 0
    fi
    if grep -q '^WORKER_IMAGE=' yusic-worker.env; then
      sed -i "s|^WORKER_IMAGE=.*|WORKER_IMAGE={{ (yusic_worker_backup_images | default({})).get(yusic_worker.alias, '') }}|" yusic-worker.env
    else
      printf '%s\n' "WORKER_IMAGE={{ (yusic_worker_backup_images | default({})).get(yusic_worker.alias, '') }}" >> yusic-worker.env
    fi
    docker compose --env-file yusic-worker.env -f docker-compose.yml up -d
    echo "__ROLLBACK_APPLIED__"
    EOSH
    fi
  args:
    executable: /bin/bash
  register: yusic_worker_rollback_cmd
  changed_when: "'__ROLLBACK_APPLIED__' in (yusic_worker_rollback_cmd.stdout | default(''))"
  no_log: true
