---
- name: Validate tailscale settings
  ansible.builtin.assert:
    that:
      - tailscale_state == "present"
      - tailscale_auth_key_env | trim | length > 0
      - tailscale_extra_args is iterable
      - tailscale_extra_args is not string
    fail_msg: "Invalid tailscale settings. Supported tailscale_state: present"
  when: tailscale_enabled | bool
  tags: [tailscale]

- name: Detect OpenWrt target
  ansible.builtin.raw: "test -f /etc/openwrt_release && echo OPENWRT || echo NON_OPENWRT"
  register: tailscale_openwrt_probe
  changed_when: false
  failed_when: false
  when: tailscale_enabled | bool
  tags: [tailscale]

- name: Set tailscale host flavor
  ansible.builtin.set_fact:
    # Equality check: probe outputs literal "OPENWRT" or "NON_OPENWRT", and a
    # naive `in` substring match returns true for both because "NON_OPENWRT"
    # contains the substring "OPENWRT". Compare against the trimmed token
    # instead so non-OpenWrt hosts are classified correctly.
    tailscale_is_openwrt: "{{ (tailscale_openwrt_probe.stdout | default('') | trim) == 'OPENWRT' }}"
  changed_when: false
  when: tailscale_enabled | bool
  tags: [tailscale]

- name: Validate supported server OS for tailscale role
  ansible.builtin.assert:
    that:
      - ansible_os_family == "Debian" or (ansible_os_family == "RedHat" and (ansible_distribution_major_version | int) >= 9)
    fail_msg: "tailscale role supports Debian/Ubuntu and RHEL9-compatible hosts in server contour."
  when:
    - tailscale_enabled | bool
    - not (tailscale_is_openwrt | bool)
  tags: [tailscale]

- name: Install tailscale prerequisites on Debian family
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
  when:
    - tailscale_enabled | bool
    - not (tailscale_is_openwrt | bool)
    - ansible_os_family == "Debian"
  tags: [tailscale]

- name: Ensure tailscale keyring directory exists
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - tailscale_enabled | bool
    - not (tailscale_is_openwrt | bool)
    - ansible_os_family == "Debian"
  tags: [tailscale]

- name: Install tailscale apt keyring
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }}/{{ ansible_distribution_release }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    owner: root
    group: root
    mode: "0644"
    force: true
  when:
    - tailscale_enabled | bool
    - not (tailscale_is_openwrt | bool)
    - ansible_os_family == "Debian"
  tags: [tailscale]

- name: Configure tailscale apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg]
      https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }}
      {{ ansible_distribution_release }} main
    filename: tailscale
    state: present
    update_cache: true
  when:
    - tailscale_enabled | bool
    - not (tailscale_is_openwrt | bool)
    - ansible_os_family == "Debian"
  tags: [tailscale]

- name: Configure tailscale yum repository for RHEL9-compatible hosts
  ansible.builtin.yum_repository:
    name: tailscale-stable
    description: Tailscale stable
    baseurl: "https://pkgs.tailscale.com/stable/rhel/{{ ansible_distribution_major_version | int }}/$basearch"
    enabled: true
    gpgcheck: true
    repo_gpgcheck: false
    gpgkey: "https://pkgs.tailscale.com/stable/rhel/{{ ansible_distribution_major_version | int }}/repo.gpg"
  when:
    - tailscale_enabled | bool
    - not (tailscale_is_openwrt | bool)
    - ansible_os_family == "RedHat"
  tags: [tailscale]

- name: Install tailscale package on server hosts
  ansible.builtin.package:
    name: "{{ tailscale_package }}"
    state: present
  when:
    - tailscale_enabled | bool
    - not (tailscale_is_openwrt | bool)
  tags: [tailscale]

- name: Install optional OpenWrt tailscale prerequisites
  ansible.builtin.raw: |
    missing=""
    for pkg in {{ tailscale_openwrt_prereq_packages | join(' ') }}; do
      opkg list-installed | grep -q "^${pkg} " || missing="${missing} ${pkg}"
    done

    if [ -n "${missing}" ]; then
      opkg update >/dev/null 2>&1 || opkg update
      opkg install ${missing}
      echo "CHANGED"
    else
      echo "NOCHANGE"
    fi
  register: tailscale_openwrt_prereq_install
  changed_when: "'CHANGED' in tailscale_openwrt_prereq_install.stdout"
  failed_when: tailscale_openwrt_prereq_install.rc != 0
  when:
    - tailscale_enabled | bool
    - tailscale_is_openwrt | bool
    - tailscale_openwrt_prereq_packages | length > 0
  tags: [tailscale]

- name: Install tailscale package on OpenWrt
  ansible.builtin.raw: |
    if opkg list-installed | grep -q "^{{ tailscale_package }} "; then
      echo "NOCHANGE"
    else
      opkg update >/dev/null 2>&1 || opkg update
      opkg install {{ tailscale_package }}
      echo "CHANGED"
    fi
  register: tailscale_openwrt_install
  changed_when: "'CHANGED' in tailscale_openwrt_install.stdout"
  failed_when: tailscale_openwrt_install.rc != 0
  when:
    - tailscale_enabled | bool
    - tailscale_is_openwrt | bool
  tags: [tailscale]

- name: Enable and start tailscale service on server hosts
  ansible.builtin.service:
    name: "{{ tailscale_service_name }}"
    state: started
    enabled: true
  when:
    - tailscale_enabled | bool
    - not (tailscale_is_openwrt | bool)
  tags: [tailscale]

- name: Enable tailscale service at boot on OpenWrt
  ansible.builtin.raw: "/etc/init.d/{{ tailscale_openwrt_service_name }} enable"
  changed_when: false
  when:
    - tailscale_enabled | bool
    - tailscale_is_openwrt | bool
  tags: [tailscale]

- name: Start tailscale service on OpenWrt
  ansible.builtin.raw: "/etc/init.d/{{ tailscale_openwrt_service_name }} start"
  changed_when: false
  when:
    - tailscale_enabled | bool
    - tailscale_is_openwrt | bool
  tags: [tailscale]

- name: Read tailscale backend state on server hosts
  ansible.builtin.command: tailscale status --json
  register: tailscale_backend_state_cmd
  changed_when: false
  failed_when: false
  when:
    - tailscale_enabled | bool
    - not (tailscale_is_openwrt | bool)
  tags: [tailscale]

- name: Read tailscale backend state on OpenWrt
  ansible.builtin.raw: "tailscale status --json 2>/dev/null || true"
  register: tailscale_backend_state_cmd
  changed_when: false
  failed_when: false
  when:
    - tailscale_enabled | bool
    - tailscale_is_openwrt | bool
  tags: [tailscale]

- name: Resolve tailscale status JSON + backend state
  ansible.builtin.set_fact:
    tailscale_status_json: >-
      {{
        (
          tailscale_backend_state_cmd.stdout | default('') | trim | regex_search('^\{')
        ) | ternary((tailscale_backend_state_cmd.stdout | from_json), {})
      }}
    tailscale_backend_state: >-
      {{
        (
          (
            tailscale_backend_state_cmd.stdout | default('') | trim | regex_search('^\{')
          ) | ternary((tailscale_backend_state_cmd.stdout | from_json), {})
        ).BackendState | default('NoState')
      }}
  changed_when: false
  when: tailscale_enabled | bool
  tags: [tailscale]

- name: Derive tailscale_is_authenticated from backend state
  ansible.builtin.set_fact:
    # Ansible's set_fact does not guarantee resolution order between sibling
    # vars in one block — using `tailscale_backend_state` inside the same
    # set_fact that defines it produces "undefined" at resolution time. Split
    # off the dependent flag into its own task that runs after the previous
    # task has committed `tailscale_backend_state` into the fact cache.
    tailscale_is_authenticated: >-
      {{ tailscale_backend_state not in ['NoState', 'NeedsLogin', 'NeedsMachineAuth', 'Stopped', ''] }}
  changed_when: false
  when: tailscale_enabled | bool
  tags: [tailscale]

- name: Read tailscale auth key from environment
  ansible.builtin.set_fact:
    tailscale_auth_key_value: "{{ lookup('env', tailscale_auth_key_env) | default('', true) | trim }}"
  no_log: true
  changed_when: false
  when:
    - tailscale_enabled | bool
    - tailscale_state == "present"
    - not (tailscale_is_authenticated | bool)
  tags: [tailscale]

- name: Require tailscale auth key when host is not authenticated
  ansible.builtin.assert:
    that:
      - tailscale_auth_key_value | length > 0
    fail_msg: >-
      Tailscale is not authenticated on host {{ inventory_hostname }}.
      Provide {{ tailscale_auth_key_env }} in workflow environment.
  when:
    - tailscale_enabled | bool
    - tailscale_state == "present"
    - not (tailscale_is_authenticated | bool)
  tags: [tailscale]

- name: Join tailnet on server hosts when not authenticated
  ansible.builtin.command:
    argv: "{{ ['tailscale', 'up', '--auth-key=' ~ tailscale_auth_key_value] + (tailscale_extra_args | default([])) }}"
  register: tailscale_up_cmd
  changed_when: tailscale_up_cmd.rc == 0
  failed_when: tailscale_up_cmd.rc != 0
  no_log: true
  when:
    - tailscale_enabled | bool
    - tailscale_state == "present"
    - not (tailscale_is_openwrt | bool)
    - not (tailscale_is_authenticated | bool)
  tags: [tailscale]

- name: Join tailnet on OpenWrt when not authenticated
  ansible.builtin.raw: >-
    tailscale up --auth-key={{ tailscale_auth_key_value | quote }}
    {%- set _args = (tailscale_extra_args | default([])) + (tailscale_openwrt_extra_args | default([])) %}
    {%- for arg in _args %} {{ arg | quote }}{% endfor %}
  register: tailscale_up_cmd
  changed_when: tailscale_up_cmd.rc == 0
  failed_when: tailscale_up_cmd.rc != 0
  no_log: true
  when:
    - tailscale_enabled | bool
    - tailscale_state == "present"
    - tailscale_is_openwrt | bool
    - not (tailscale_is_authenticated | bool)
  tags: [tailscale]

# `tailscale up` returns when the login API call is accepted, NOT when the
# local daemon's BackendState transitions to Running. The daemon transition
# NoState → NeedsLogin → Starting → Running can take several seconds on a
# fresh host (session bootstrap, DERP map fetch, peer key exchange).
# Reading status immediately after `tailscale up` produced spurious
# NoState results and a hard-fail at the final assert (yusic-5a3, ae-us-1,
# 2026-05-07). The dedicated wait task below polls until BackendState is
# Running with a 15 × 2s budget. It uses a private register and the same
# regex_search/from_json ternary pattern as the Resolve tasks below to keep
# the until expression safe against an empty stdout (a bare `from_json` on
# `''` raises and aborts the retry loop in Ansible 2.20). The task is
# allowed to fail loudly so a missed Running transition surfaces here, not
# downstream as an opaque NoState assert.
# `tailscale up` returns when the login API call is accepted, NOT when the
# local daemon's BackendState transitions to Running. The daemon transition
# NoState → NeedsLogin → Starting → Running can take several seconds on a
# fresh host (session bootstrap, DERP map fetch, peer key exchange).
# Reading status immediately after `tailscale up` produced spurious
# NoState results and a hard-fail at the final assert (yusic-5a3, ae-us-1,
# 2026-05-07). The dedicated wait tasks below poll until BackendState is
# Running with a 15 × 2s budget. Each branch (server / OpenWrt) MUST use
# its own register name: when a sibling task is skipped via `when:`,
# Ansible writes a skip marker (`{changed: false, skipped: true}`) to its
# register that has no `.stdout` attribute. A shared register name means
# the OpenWrt skip stomps the server-host result the moment the OpenWrt
# task is evaluated, and the next consumer of the register sees an empty
# `stdout`, which the regex_search/from_json/default chain collapses to
# `BackendState=NoState` — exactly the symptom that took down PRs #35
# and #36 against ae-us-1. The `set_fact` capture below selects the
# correct register per host without giving Ansible a chance to overwrite
# either source register, because `set_fact` (unlike `register`) does not
# write when its `when:` condition is false.
- name: Wait for tailscale daemon to reach BackendState=Running on server hosts
  ansible.builtin.command: tailscale status --json
  register: tailscale_wait_running_server_cmd
  changed_when: false
  retries: 15
  delay: 2
  until: >-
    (
      (
        (tailscale_wait_running_server_cmd.stdout | default('') | trim | regex_search('^\{'))
        | ternary((tailscale_wait_running_server_cmd.stdout | from_json), {})
      ).BackendState | default('NoState')
    ) == 'Running'
  when:
    - tailscale_enabled | bool
    - not (tailscale_is_openwrt | bool)
  tags: [tailscale]

- name: Wait for tailscale daemon to reach BackendState=Running on OpenWrt
  ansible.builtin.raw: "tailscale status --json 2>/dev/null || true"
  register: tailscale_wait_running_openwrt_cmd
  changed_when: false
  retries: 15
  delay: 2
  until: >-
    (
      (
        (tailscale_wait_running_openwrt_cmd.stdout | default('') | trim | regex_search('^\{'))
        | ternary((tailscale_wait_running_openwrt_cmd.stdout | from_json), {})
      ).BackendState | default('NoState')
    ) == 'Running'
  when:
    - tailscale_enabled | bool
    - tailscale_is_openwrt | bool
  tags: [tailscale]

# Capture the last successful Wait stdout into a per-host fact via
# `set_fact` (no skip-overwrite), so the Resolve task below sees a
# stable, non-empty source regardless of which branch ran.
- name: Capture tailscale post-join status stdout (server hosts)
  ansible.builtin.set_fact:
    tailscale_post_join_status_stdout: "{{ tailscale_wait_running_server_cmd.stdout | default('') }}"
    tailscale_post_join_status_stderr: "{{ tailscale_wait_running_server_cmd.stderr | default('') }}"
  when:
    - tailscale_enabled | bool
    - not (tailscale_is_openwrt | bool)
  tags: [tailscale]

- name: Capture tailscale post-join status stdout (OpenWrt)
  ansible.builtin.set_fact:
    tailscale_post_join_status_stdout: "{{ tailscale_wait_running_openwrt_cmd.stdout | default('') }}"
    tailscale_post_join_status_stderr: "{{ tailscale_wait_running_openwrt_cmd.stderr | default('') }}"
  when:
    - tailscale_enabled | bool
    - tailscale_is_openwrt | bool
  tags: [tailscale]

- name: Resolve tailscale post-join status JSON + backend state
  ansible.builtin.set_fact:
    tailscale_status_after_json: >-
      {{
        (
          tailscale_post_join_status_stdout | default('') | trim | regex_search('^\{')
        ) | ternary((tailscale_post_join_status_stdout | from_json), {})
      }}
    # Inline BackendState extraction — same self-contained pattern as the
    # pre-join "Resolve tailscale status JSON + backend state" task. Ansible
    # does not guarantee resolution order between sibling vars in one
    # set_fact, so a reference to tailscale_status_after_json from a sibling
    # would resolve as undefined.
    tailscale_backend_state_after: >-
      {{
        (
          (
            tailscale_post_join_status_stdout | default('') | trim | regex_search('^\{')
          ) | ternary((tailscale_post_join_status_stdout | from_json), {})
        ).BackendState | default('NoState')
      }}
  changed_when: false
  when: tailscale_enabled | bool
  tags: [tailscale]

- name: Assert tailscale backend state is healthy
  ansible.builtin.assert:
    that:
      - tailscale_backend_state_after not in ['NoState', 'NeedsLogin', 'NeedsMachineAuth', 'Stopped', '']
    fail_msg: >-
      Tailscale backend state is {{ tailscale_backend_state_after | default('unknown') }}
      on host {{ inventory_hostname }} after the post-join retry budget elapsed.
      Last status stdout (truncated): {{ (tailscale_post_join_status_stdout | default(''))[:500] }}
      Last status stderr (truncated): {{ (tailscale_post_join_status_stderr | default(''))[:500] }}
  when: tailscale_enabled | bool
  tags: [tailscale]

# Expose this host's tailnet IPv4 as a fact so downstream roles
# (monitoring_stack, monitoring_agent, etc.) can bind their service
# ports to the tailnet interface instead of 0.0.0.0. The IPv4 is
# pulled from the post-join status JSON; if no IPv4 is found (IPv6-only
# tailnet, exotic config) `tailscale_self_ipv4` stays empty and the
# downstream defaults fall back to 127.0.0.1 rather than expose
# anything publicly.
- name: Expose tailscale IPv4 of this host as a fact
  ansible.builtin.set_fact:
    tailscale_self_ipv4: >-
      {{
        tailscale_status_after_json.TailscaleIPs
        | default([])
        | select('match', '^\d+\.\d+\.\d+\.\d+$')
        | first
        | default('')
      }}
  changed_when: false
  when: tailscale_enabled | bool
  tags: [tailscale]
