---
- name: Validate supported OS for firewall role
  ansible.builtin.assert:
    that:
      - ansible_os_family == "Debian"
    fail_msg: "Role firewall supports Debian/Ubuntu only."

- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

- name: Set UFW default incoming policy
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Set UFW default outgoing policy
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Allow SSH port through UFW
  community.general.ufw:
    rule: allow
    port: "{{ firewall_ssh_port | string }}"
    proto: tcp

- name: Allow required public TCP ports through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: tcp
  loop: "{{ firewall_public_tcp_ports }}"

- name: Build effective extra TCP ports list (including remnawave node port)
  ansible.builtin.set_fact:
    firewall_extra_tcp_ports_effective: >-
      {{
        (
          firewall_allowed_tcp_ports | default([], true) | map('int') | list
        )
        + (
          (
            firewall_auto_allow_remnawave_node_port | bool
            and (effective_feature_remnawave_node | default(false) | bool)
            and ((remnawave_node_port | default(0) | int) > 0)
            and ((remnawave_node_port | default(0) | int) < 65536)
          )
          | ternary([remnawave_node_port | int], [])
        )
        | unique
        | list
      }}
  changed_when: false

- name: Allow extra TCP ports through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: tcp
  loop: "{{ firewall_extra_tcp_ports_effective }}"

- name: Allow extra UDP ports through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: udp
  loop: "{{ firewall_allowed_udp_ports }}"

- name: Build effective source-scoped TCP rules
  ansible.builtin.set_fact:
    firewall_source_tcp_rules_effective: >-
      {{
        (
          firewall_source_tcp_rules | default([], true)
          + (
            (firewall_manage_redis_rules | bool and firewall_allow_tailnet_redis_only | bool)
            | ternary([{"port": firewall_redis_port | int, "proto": "tcp", "from_ip": firewall_tailnet_cidr}], [])
          )
          + (
            (
              firewall_manage_redis_rules | bool
              | ternary(firewall_allowlist_redis_sources, [])
            )
            | default([], true)
            | map('regex_replace', '^(.*)$', '{"port": ' ~ (firewall_redis_port | int | string) ~ ', "proto": "tcp", "from_ip": "\\1"}')
            | map('from_yaml')
            | list
          )
        )
      }}
  changed_when: false

- name: Remove public allow rule for Redis when source-scoped mode is enabled
  community.general.ufw:
    rule: allow
    port: "{{ firewall_redis_port | string }}"
    proto: tcp
    delete: true
  when:
    - firewall_manage_redis_rules | bool
    - firewall_allow_tailnet_redis_only | bool or (firewall_allowlist_redis_sources | default([], true) | length > 0)

- name: Allow source-scoped TCP rules through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item.port | string }}"
    proto: "{{ item.proto | default('tcp') }}"
    src: "{{ item.from_ip }}"
  loop: "{{ firewall_source_tcp_rules_effective | default([], true) }}"
  when:
    - item.from_ip is defined
    - (item.from_ip | string | length) > 0

- name: Remove public allow rule for Caddy monitor port when disabled
  community.general.ufw:
    rule: allow
    port: "{{ firewall_caddy_monitor_port | string }}"
    proto: tcp
    delete: true
  when: not (firewall_open_caddy_monitor_port | bool)

- name: Allow Caddy monitor port publicly when explicitly enabled
  community.general.ufw:
    rule: allow
    port: "{{ firewall_caddy_monitor_port | string }}"
    proto: tcp
  when: firewall_open_caddy_monitor_port | bool

- name: Enable UFW
  community.general.ufw:
    state: enabled
  when: firewall_enabled | bool
