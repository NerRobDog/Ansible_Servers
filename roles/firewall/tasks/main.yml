---
- name: Validate supported OS for firewall role
  ansible.builtin.assert:
    that:
      - ansible_os_family == "Debian"
    fail_msg: "Role firewall supports Debian/Ubuntu only."

- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

- name: Set UFW default incoming policy
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Set UFW default outgoing policy
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Allow SSH port through UFW
  community.general.ufw:
    rule: allow
    port: "{{ firewall_ssh_port | string }}"
    proto: tcp

- name: Allow required public TCP ports through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: tcp
  loop: "{{ firewall_public_tcp_ports }}"

- name: Build effective extra TCP ports list (including remnawave node port)
  ansible.builtin.set_fact:
    firewall_extra_tcp_ports_effective: >-
      {{
        (
          firewall_allowed_tcp_ports | default([], true) | map('int') | list
        )
        + (
          (
            firewall_auto_allow_remnawave_node_port | bool
            and (effective_feature_remnawave_node | default(false) | bool)
            and ((remnawave_node_port | default(0) | int) > 0)
            and ((remnawave_node_port | default(0) | int) < 65536)
          )
          | ternary([remnawave_node_port | int], [])
        )
        | unique
        | list
      }}
  changed_when: false

- name: Allow extra TCP ports through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: tcp
  loop: "{{ firewall_extra_tcp_ports_effective }}"

- name: Allow extra UDP ports through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: udp
  loop: "{{ firewall_allowed_udp_ports }}"

- name: Remove public allow rule for Caddy monitor port when disabled
  community.general.ufw:
    rule: allow
    port: "{{ firewall_caddy_monitor_port | string }}"
    proto: tcp
    delete: true
  when: not (firewall_open_caddy_monitor_port | bool)

- name: Allow Caddy monitor port publicly when explicitly enabled
  community.general.ufw:
    rule: allow
    port: "{{ firewall_caddy_monitor_port | string }}"
    proto: tcp
  when: firewall_open_caddy_monitor_port | bool

- name: Enable UFW
  community.general.ufw:
    state: enabled
  when: firewall_enabled | bool
