---
monitoring_stack_install_path: /opt/monitoring-stack
monitoring_stack_manage_runtime: true
monitoring_stack_retention_days: 7

monitoring_stack_prometheus_image: prom/prometheus:v2.55.0
monitoring_stack_alertmanager_image: prom/alertmanager:v0.28.1
monitoring_stack_grafana_image: grafana/grafana:11.2.2
monitoring_stack_loki_image: grafana/loki:3.1.1
monitoring_stack_promtail_image: grafana/promtail:3.1.1

monitoring_stack_prometheus_port: 9090
monitoring_stack_alertmanager_port: 9093
monitoring_stack_grafana_port: 3000
monitoring_stack_loki_port: 3100

# Address the dashboard endpoints (Grafana, Prometheus UI, Alertmanager UI,
# Loki) bind to. Defaults to this host's tailnet IPv4 when the tailscale
# role has populated `tailscale_self_ipv4`, otherwise loopback. Override
# in group_vars / host_vars / fleet config (`monitoring.stack_bind_address`)
# to expose publicly — only if you know what you are doing: the Grafana
# admin password is rendered into the runtime compose file in plaintext.
monitoring_stack_bind_address: "{{ (tailscale_self_ipv4 | default('') | trim) or '127.0.0.1' }}"

monitoring_stack_grafana_admin_user: admin
monitoring_stack_grafana_admin_password: ""
monitoring_stack_scrape_fleet_agents: true
monitoring_stack_scrape_openwrt_agents: true
