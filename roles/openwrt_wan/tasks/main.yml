---
- name: Validate OpenWrt WAN settings
  ansible.builtin.assert:
    that:
      - openwrt_wan_proto in ['dhcp', 'static', 'pppoe']
      - openwrt_wan_device | trim | length > 0
      - (openwrt_wan_proto != 'static') or (openwrt_wan_ipaddr | trim | length > 0)
      - (openwrt_wan_proto != 'static') or (openwrt_wan_netmask | trim | length > 0)
      - (openwrt_wan_proto != 'pppoe') or (openwrt_wan_pppoe_username | trim | length > 0)
      - (openwrt_wan_proto != 'pppoe') or (openwrt_wan_pppoe_password | trim | length > 0)
      - openwrt_wan_pppoe_ipv6 in ['auto', '0', '1']
      - openwrt_wan_dns is iterable
      - openwrt_wan_dns is not string
      - (openwrt_wan_boot_try_dhcp_wait_sec | int) > 0
      - (openwrt_wan_boot_try_dhcp_probe_count | int) > 0
      - openwrt_wan_boot_try_dhcp_probe_host | trim | length > 0
      - openwrt_wan_boot_try_dhcp_service_name | trim | length > 0
      - openwrt_wan_boot_try_dhcp_service_name is match('^[A-Za-z0-9_-]+$')
      - (openwrt_wan_boot_try_dhcp_start_priority | int) > 0
      - (openwrt_wan_boot_try_dhcp_start_priority | int) < 100
    fail_msg: "Invalid OpenWrt WAN config. Check WAN profile and boot failover fields."
  tags: [openwrt, wan, network]

- name: Configure OpenWrt WAN interface
  ansible.builtin.raw: |
    set -eu

    proto='{{ openwrt_wan_proto }}'
    changed='0'

    ensure_set() {
      key="$1"
      val="$2"
      current="$(uci -q get "$key" || true)"
      if [ "$current" != "$val" ]; then
        uci set "$key=$val"
        changed='1'
      fi
    }

    ensure_delete() {
      key="$1"
      if uci -q get "$key" >/dev/null 2>&1; then
        uci -q delete "$key"
        changed='1'
      fi
    }

    if [ "$(uci -q get network.wan || true)" != "interface" ]; then
      uci -q delete network.wan || true
      uci set network.wan='interface'
      changed='1'
    fi

    ensure_set network.wan.device '{{ openwrt_wan_device }}'
    ensure_set network.wan.proto "$proto"

    if [ "$proto" = "dhcp" ]; then
      ensure_delete network.wan.ipaddr
      ensure_delete network.wan.netmask
      ensure_delete network.wan.gateway
      ensure_delete network.wan.username
      ensure_delete network.wan.password
      ensure_delete network.wan.ipv6
    fi

    if [ "$proto" = "static" ]; then
      ensure_set network.wan.ipaddr '{{ openwrt_wan_ipaddr }}'
      ensure_set network.wan.netmask '{{ openwrt_wan_netmask }}'
      if [ '{{ openwrt_wan_gateway | trim }}' = '' ]; then
        ensure_delete network.wan.gateway
      else
        ensure_set network.wan.gateway '{{ openwrt_wan_gateway }}'
      fi
      ensure_delete network.wan.username
      ensure_delete network.wan.password
      ensure_delete network.wan.ipv6
    fi

    if [ "$proto" = "pppoe" ]; then
      ensure_set network.wan.username '{{ openwrt_wan_pppoe_username }}'
      ensure_set network.wan.password '{{ openwrt_wan_pppoe_password }}'
      ensure_set network.wan.ipv6 '{{ openwrt_wan_pppoe_ipv6 }}'
      ensure_delete network.wan.ipaddr
      ensure_delete network.wan.netmask
      ensure_delete network.wan.gateway
    fi

    desired_dns='{{ openwrt_wan_dns | map("trim") | reject("equalto", "") | join(" ") }}'
    current_dns="$(uci -q get network.wan.dns 2>/dev/null | sed 's/[[:space:]]*$//')"
    if [ -n "$desired_dns" ]; then
      ensure_set network.wan.peerdns '0'
      if [ "$current_dns" != "$desired_dns" ]; then
        ensure_delete network.wan.dns
        {% for dns in openwrt_wan_dns %}
        {% if dns | trim | length > 0 %}
        uci add_list network.wan.dns='{{ dns }}'
        {% endif %}
        {% endfor %}
        changed='1'
      fi
    else
      ensure_set network.wan.peerdns '1'
      ensure_delete network.wan.dns
    fi

    if [ "$changed" = "1" ]; then
      uci commit network
      /etc/init.d/network reload >/dev/null 2>&1 || /etc/init.d/network restart
      echo CHANGED
    else
      echo NOCHANGE
    fi
  register: openwrt_wan_configure
  changed_when: "'CHANGED' in openwrt_wan_configure.stdout"
  failed_when: openwrt_wan_configure.rc != 0
  tags: [openwrt, wan, network]

- name: Deploy WAN boot failover UCI config
  ansible.builtin.raw: |
    set -eu
    cfg="/etc/config/{{ openwrt_wan_boot_try_dhcp_service_name }}"
    old_sum="$(md5sum "${cfg}" 2>/dev/null | awk '{print $1}')"
    cat <<'EOF_WAN_FAILOVER_CFG' > "${cfg}"
    {{ lookup('template', 'wan-failover-config.j2') | trim }}
    EOF_WAN_FAILOVER_CFG
    new_sum="$(md5sum "${cfg}" | awk '{print $1}')"

    if [ "${old_sum}" != "${new_sum}" ]; then
      echo "CHANGED"
    else
      echo "NOCHANGE"
    fi
  when:
    - openwrt_wan_boot_try_dhcp_first | bool
    - openwrt_wan_proto != 'dhcp'
  register: openwrt_wan_failover_config
  changed_when: "'CHANGED' in openwrt_wan_failover_config.stdout"
  failed_when: openwrt_wan_failover_config.rc != 0
  tags: [openwrt, wan, network]

- name: Deploy WAN boot failover init script
  ansible.builtin.raw: |
    set -eu
    init="/etc/init.d/{{ openwrt_wan_boot_try_dhcp_service_name }}"
    old_sum="$(md5sum "${init}" 2>/dev/null | awk '{print $1}')"
    cat <<'EOF_WAN_FAILOVER_INIT' > "${init}"
    {{ lookup('template', 'wan-failover-init.j2') | trim }}
    EOF_WAN_FAILOVER_INIT
    chmod 755 "${init}"
    new_sum="$(md5sum "${init}" | awk '{print $1}')"

    if [ "${old_sum}" != "${new_sum}" ]; then
      echo "CHANGED"
    else
      echo "NOCHANGE"
    fi
  when:
    - openwrt_wan_boot_try_dhcp_first | bool
    - openwrt_wan_proto != 'dhcp'
  register: openwrt_wan_failover_init
  changed_when: "'CHANGED' in openwrt_wan_failover_init.stdout"
  failed_when: openwrt_wan_failover_init.rc != 0
  tags: [openwrt, wan, network]

- name: Enable WAN boot failover init service
  ansible.builtin.raw: |
    set -eu
    service="/etc/init.d/{{ openwrt_wan_boot_try_dhcp_service_name }}"
    if [ -x "${service}" ]; then
      "${service}" disable >/dev/null 2>&1 || true
      "${service}" enable >/dev/null 2>&1 || true
    fi
    echo "OK"
  when:
    - openwrt_wan_boot_try_dhcp_first | bool
    - openwrt_wan_proto != 'dhcp'
  changed_when: false
  tags: [openwrt, wan, network]

- name: Remove WAN boot failover service when disabled or not needed
  ansible.builtin.raw: |
    set -eu
    name="{{ openwrt_wan_boot_try_dhcp_service_name }}"
    changed='0'

    if [ -x "/etc/init.d/${name}" ]; then
      "/etc/init.d/${name}" disable >/dev/null 2>&1 || true
    fi

    for link in /etc/rc.d/*"${name}"; do
      [ -e "${link}" ] || continue
      rm -f "${link}"
      changed='1'
    done

    if [ -e "/etc/init.d/${name}" ]; then
      rm -f "/etc/init.d/${name}"
      changed='1'
    fi

    if [ -e "/etc/config/${name}" ]; then
      rm -f "/etc/config/${name}"
      changed='1'
    fi

    if [ "${changed}" = "1" ]; then
      echo "CHANGED"
    else
      echo "NOCHANGE"
    fi
  when: not (openwrt_wan_boot_try_dhcp_first | bool and openwrt_wan_proto != 'dhcp')
  register: openwrt_wan_failover_cleanup
  changed_when: "'CHANGED' in openwrt_wan_failover_cleanup.stdout"
  failed_when: openwrt_wan_failover_cleanup.rc != 0
  tags: [openwrt, wan, network]
