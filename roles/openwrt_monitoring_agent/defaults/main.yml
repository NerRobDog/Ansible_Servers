---
openwrt_monitoring_enabled: true
openwrt_node_exporter_port: 9100
openwrt_probe_interval_minutes: 1
openwrt_probe_timeout_seconds: 12
openwrt_probe_script_path: /usr/local/bin/openwrt-connectivity-probe.sh
openwrt_probe_metrics_path: /var/prometheus/openwrt-connectivity.prom
openwrt_monitoring_packages:
  - prometheus-node-exporter-lua
  - prometheus-node-exporter-lua-openwrt
  - prometheus-node-exporter-lua-netstat
  - prometheus-node-exporter-lua-thermal
  - prometheus-node-exporter-lua-textfile
  - curl
  - ca-bundle
