---
tv_kiosk_enabled: true

# User that owns the graphical session. Same user that Sunshine runs under;
# Kodi inherits the desktop session, so capture works without extra setup.
tv_kiosk_user: deploy
tv_kiosk_group: deploy

# Packages: Kodi from the distro repo (Ubuntu 24.04 carries Kodi 20.x). The
# team-xbmc PPA does not currently publish a Release file for `noble`, so we
# stay on universe; flip tv_kiosk_apt_ppa to a working PPA when one exists.
tv_kiosk_apt_ppa: ""
tv_kiosk_packages:
  - kodi
  - kodi-peripheral-joystick
  - kodi-pvr-iptvsimple
  - cec-utils
  - libcec6
  - cage
  - seatd
  - greetd

# Greetd config — autologin into a cage session that exec's Kodi.
tv_kiosk_greetd_config: /etc/greetd/config.toml

# Kodi addons to preinstall via zip. Each: {id, url, sha256}.
tv_kiosk_addons:
  # Python module deps from the official Kodi mirror. Kodi auto-resolves these
  # only when an addon is installed through the in-app repo browser; dropping
  # zips into ~/.kodi/addons/ does NOT trigger dependency resolution, so we
  # pre-fetch them here. Order matters — module deps before the addons that
  # need them.
  - id: script.module.requests
    url: "https://mirrors.kodi.tv/addons/nexus/script.module.requests/script.module.requests-2.31.0.zip"
    sha256: ""
  - id: script.module.bottle
    url: "https://mirrors.kodi.tv/addons/nexus/script.module.bottle/script.module.bottle-0.13.2.zip"
    sha256: ""
  - id: script.module.kodi-six
    url: "https://mirrors.kodi.tv/addons/nexus/script.module.kodi-six/script.module.kodi-six-0.1.3.1.zip"
    sha256: ""
  - id: plugin.video.youtube
    # YouTube playback engine. The phone-cast feature does NOT live here —
    # the YouTube addon does not advertise itself via DIAL/SSDP. It plays
    # the URL once tubecast routes a Cast V1 session into it.
    url: "https://github.com/anxdpanic/plugin.video.youtube/releases/download/v7.4.3/plugin.video.youtube-7.4.3.zip"
    sha256: ""
  - id: script.tubecast
    # Reverse-engineered Chromecast V1 emulator. Listens on SSDP, accepts
    # the Cast V1 session from the YouTube mobile app, and proxies the
    # play/pause/queue commands into plugin.video.youtube. Without this
    # addon there is no cast icon for Kodi in the YouTube app.
    url: "https://github.com/enen92/script.tubecast/releases/download/1.5.0%2Bmatrix.1/script.tubecast-1.5.0%2Bmatrix.1.zip"
    sha256: ""
  - id: plugin.video.elementum
    # Sequential-download torrent streamer (linux_x64 binary build).
    url: "https://github.com/elgatito/plugin.video.elementum/releases/download/v0.1.113/plugin.video.elementum-0.1.113.linux_x64.zip"
    sha256: ""

tv_kiosk_kodi_home: "/home/{{ tv_kiosk_user }}/.kodi"
tv_kiosk_userdata_dir: "{{ tv_kiosk_kodi_home }}/userdata"
tv_kiosk_addons_dir: "{{ tv_kiosk_kodi_home }}/addons"
