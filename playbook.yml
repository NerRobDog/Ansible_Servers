---
- name: Подготовка сервера для деплоя
  hosts: all
  become: true
  pre_tasks:
    - name: Resolve fleet mode and host config
      ansible.builtin.set_fact:
        fleet_mode_effective: "{{ fleet_mode | default('deploy') }}"
        fleet_host_cfg: "{{ (fleet_hosts | default({})).get(inventory_hostname, {}) }}"
      changed_when: false
      tags: [always]

    - name: Validate fleet host config when provided
      ansible.builtin.assert:
        that:
          - fleet_host_cfg is mapping
      when: (fleet_hosts | default({})) | length > 0
      tags: [always]

    - name: Resolve effective feature flags
      ansible.builtin.set_fact:
        effective_run_main_stack: "{{ fleet_mode_effective == 'deploy' }}"
        effective_feature_base: "{{ fleet_host_cfg.get('features', {}).get('feature_base', feature_base) | bool }}"
        effective_feature_firewall: "{{ fleet_host_cfg.get('features', {}).get('feature_firewall', feature_firewall) | bool }}"
        effective_feature_docker: "{{ fleet_host_cfg.get('features', {}).get('feature_docker', feature_docker) | bool }}"
        effective_feature_tailscale: "{{ fleet_host_cfg.get('features', {}).get('feature_tailscale', feature_tailscale) | bool }}"
        effective_feature_remnawave_node: "{{ fleet_host_cfg.get('features', {}).get('feature_remnawave_node', feature_remnawave_node) | bool }}"
        effective_feature_caddy_node: "{{ fleet_host_cfg.get('features', {}).get('feature_caddy_node', feature_caddy_node) | bool }}"
        effective_feature_node_tuning: "{{ fleet_host_cfg.get('features', {}).get('feature_node_tuning', feature_node_tuning) | bool }}"
        effective_feature_monitoring_agent: >-
          {{ fleet_host_cfg.get('features', {}).get('feature_monitoring_agent', feature_monitoring_agent) | bool }}
        effective_feature_monitoring_stack: >-
          {{ fleet_host_cfg.get('features', {}).get('feature_monitoring_stack', feature_monitoring_stack) | bool }}
        effective_feature_sing_box_proxy: >-
          {{
            fleet_host_cfg.get('features', {}).get(
              'feature_sing_box_proxy',
              feature_sing_box_proxy | default(false)
            ) | bool
          }}
        effective_sing_box_proxy_config: >-
          {{ fleet_host_cfg.get('sing_box_proxy', sing_box_proxy_config | default({})) }}
        effective_feature_zerotier: >-
          {{
            fleet_host_cfg.get('features', {}).get('feature_zerotier', feature_zerotier | default(false)) | bool
          }}
        effective_zerotier_config: >-
          {{ fleet_host_cfg.get('zerotier', zerotier_config | default({})) }}
        effective_feature_usb_automount: >-
          {{
            fleet_host_cfg.get('features', {}).get('feature_usb_automount', feature_usb_automount | default(false)) | bool
          }}
        effective_feature_rclone_serve: >-
          {{
            fleet_host_cfg.get('features', {}).get('feature_rclone_serve', feature_rclone_serve | default(false)) | bool
          }}
        effective_rclone_serve_config: >-
          {{ fleet_host_cfg.get('rclone_serve', rclone_serve_config_block | default({})) }}
        effective_feature_jellyfin: >-
          {{
            fleet_host_cfg.get('features', {}).get('feature_jellyfin', feature_jellyfin | default(false)) | bool
          }}
        effective_feature_sunshine: >-
          {{
            fleet_host_cfg.get('features', {}).get('feature_sunshine', feature_sunshine | default(false)) | bool
          }}
        effective_feature_obico: >-
          {{
            fleet_host_cfg.get('features', {}).get('feature_obico', feature_obico | default(false)) | bool
          }}
        effective_obico_config: >-
          {{ fleet_host_cfg.get('obico', obico_config | default({})) }}
        effective_feature_tv_kiosk: >-
          {{
            fleet_host_cfg.get('features', {}).get('feature_tv_kiosk', feature_tv_kiosk | default(false)) | bool
          }}
        effective_feature_vnc_desktop: >-
          {{
            fleet_host_cfg.get('features', {}).get('feature_vnc_desktop', feature_vnc_desktop | default(false)) | bool
          }}
        effective_vnc_desktop_config: >-
          {{ fleet_host_cfg.get('vnc_desktop', vnc_desktop_config | default({})) }}
        effective_feature_user_shell: >-
          {{
            (fleet_mode_effective == 'bootstrap')
            or (fleet_host_cfg.get('features', {}).get('feature_user_shell', feature_user_shell) | bool)
          }}
        effective_custom_roles: "{{ fleet_host_cfg.custom_roles | default(custom_roles, true) }}"
        effective_deploy_user: "{{ fleet_host_cfg.deploy_user | default('deploy', true) | string }}"
        effective_ssh_lockdown_enabled: "{{ (fleet_mode_effective == 'lockdown') or (ssh_lockdown_enabled | bool) }}"
      changed_when: false
      tags: [always]

    - name: Validate custom roles type
      ansible.builtin.assert:
        that:
          - effective_custom_roles is iterable
          - effective_custom_roles is not string
        fail_msg: "custom_roles must be a list of local role names."
      tags: [always]

    - name: Resolve host-level remnawave variables from fleet config
      ansible.builtin.set_fact:
        remnawave_node_secret_key: "{{ fleet_host_cfg.get('remnawave', {}).get('node_secret_key', remnawave_node_secret_key) }}"
        remnawave_node_port: "{{ fleet_host_cfg.get('remnawave', {}).get('node_port', remnawave_node_port) }}"
        remnawave_caddy_domain: "{{ fleet_host_cfg.get('remnawave', {}).get('caddy_domain', remnawave_caddy_domain) }}"
        remnawave_caddy_monitor_port: "{{ fleet_host_cfg.get('remnawave', {}).get('caddy_monitor_port', remnawave_caddy_monitor_port) }}"
        remnawave_ipv6_state: "{{ fleet_host_cfg.get('remnawave', {}).get('ipv6_state', remnawave_ipv6_state) }}"
        monitoring_agent_bind_address: "{{ fleet_host_cfg.get('monitoring', {}).get('agent_bind_address', monitoring_agent_bind_address) }}"
        monitoring_agent_node_exporter_port: "{{ fleet_host_cfg.get('monitoring', {}).get('agent_node_exporter_port', monitoring_agent_node_exporter_port) }}"
        monitoring_agent_cadvisor_port: "{{ fleet_host_cfg.get('monitoring', {}).get('agent_cadvisor_port', monitoring_agent_cadvisor_port) }}"
        monitoring_stack_retention_days: "{{ fleet_host_cfg.get('monitoring', {}).get('stack_retention_days', monitoring_stack_retention_days) }}"
        monitoring_stack_grafana_admin_user: >-
          {{ fleet_host_cfg.get('monitoring', {}).get('stack_grafana_admin_user', monitoring_stack_grafana_admin_user) }}
        monitoring_stack_grafana_admin_password: >-
          {{ fleet_host_cfg.get('monitoring', {}).get('stack_grafana_admin_password', monitoring_stack_grafana_admin_password) }}
      changed_when: false
      tags: [always]

    - name: Ensure CI public key is available in bootstrap mode
      ansible.builtin.assert:
        that:
          - (lookup('env', 'CI_DEPLOY_PUBLIC_KEY') | trim | length) > 0
        fail_msg: "CI_DEPLOY_PUBLIC_KEY environment variable is required for fleet bootstrap mode."
      when: fleet_mode_effective == "bootstrap"
      tags: [always]

    - name: Prepare bootstrap user variables for CI bootstrap mode
      ansible.builtin.set_fact:
        create_user: true
        configure_root_zsh: false
        new_user: "{{ effective_deploy_user }}"
        new_user_comment: "{{ effective_deploy_user }}"
        new_user_home: "/home/{{ effective_deploy_user }}"
        new_user_groups:
          - wheel
          - docker
        new_user_password_hash: null
        new_user_authorized_keys:
          - "{{ lookup('env', 'CI_DEPLOY_PUBLIC_KEY') }}"
        new_user_authorized_keys_exclusive: true
        new_user_passwordless_sudo: true
      when: fleet_mode_effective == "bootstrap"
      tags: [always]

  roles:
    - role: base
      when: effective_run_main_stack | bool and (effective_feature_base | bool)
      tags: [base]

    - role: firewall
      when: effective_run_main_stack | bool and (effective_feature_firewall | bool) and (firewall_enabled | bool)
      vars:
        firewall_scoped_rules: "{{ fleet_host_cfg.firewall_scoped_rules | default(firewall_scoped_rules | default([])) }}"
      tags: [firewall]

    - role: docker
      when: effective_run_main_stack | bool and (effective_feature_docker | bool)
      tags: [docker]

    - role: tailscale
      when: effective_feature_tailscale | bool
      tags: [tailscale]

    - role: monitoring_agent
      when: effective_feature_monitoring_agent | bool
      tags: [monitoring, metrics, agent]

    - role: monitoring_stack
      when: effective_feature_monitoring_stack | bool
      tags: [monitoring, metrics, grafana, prometheus, loki]

    - role: remnawave_node
      when: effective_run_main_stack | bool and (effective_feature_remnawave_node | bool)
      tags: [remnawave, node]

    - role: caddy_node
      when: effective_run_main_stack | bool and (effective_feature_caddy_node | bool)
      tags: [remnawave, caddy]

    - role: node_tuning
      when: effective_run_main_stack | bool and (effective_feature_node_tuning | bool)
      tags: [remnawave, bbr, ipv6]

    - role: user_shell
      when: effective_feature_user_shell | bool
      tags: [user, ssh, sudo, zsh, pipx]

    - role: ssh_lockdown
      when: effective_ssh_lockdown_enabled | bool
      tags: [ssh, lockdown]

    - role: sing_box_proxy
      when: effective_run_main_stack | bool and (effective_feature_sing_box_proxy | bool)
      vars:
        sing_box_proxy_config: "{{ effective_sing_box_proxy_config }}"
      tags: [sing_box, proxy]

    - role: zerotier
      when: effective_run_main_stack | bool and (effective_feature_zerotier | bool)
      vars:
        zerotier_networks: "{{ effective_zerotier_config.get('networks', []) }}"
        zerotier_member_name: "{{ effective_zerotier_config.get('member_name', inventory_hostname) }}"
        zerotier_network_flags: "{{ effective_zerotier_config.get('network_flags', {}) }}"
      tags: [zerotier]

    - role: usb_automount
      when: effective_run_main_stack | bool and (effective_feature_usb_automount | bool)
      tags: [usb_automount, storage]

    - role: rclone_serve
      when: effective_run_main_stack | bool and (effective_feature_rclone_serve | bool)
      vars:
        rclone_serve_config: "{{ effective_rclone_serve_config.get('config', '') }}"
        rclone_serve_instances: "{{ effective_rclone_serve_config.get('instances', []) }}"
        rclone_serve_bind_address: "{{ effective_rclone_serve_config.get('bind_address', '0.0.0.0') }}"
      tags: [rclone, storage]

    - role: jellyfin
      when: effective_run_main_stack | bool and (effective_feature_jellyfin | bool)
      tags: [jellyfin, media]

    - role: sunshine
      when: effective_run_main_stack | bool and (effective_feature_sunshine | bool)
      tags: [sunshine, media]

    - role: obico
      when: effective_run_main_stack | bool and (effective_feature_obico | bool)
      vars:
        obico_self_host_ml: "{{ effective_obico_config.get('self_host_ml', false) }}"
        obico_site_url: "{{ effective_obico_config.get('site_url', 'http://' ~ ansible_hostname ~ '.local') }}"
      tags: [obico, print3d]

    - role: tv_kiosk
      when: effective_run_main_stack | bool and (effective_feature_tv_kiosk | bool)
      tags: [tv_kiosk, kiosk]

    - role: vnc_desktop
      when: effective_run_main_stack | bool and (effective_feature_vnc_desktop | bool)
      vars:
        vnc_desktop_environment: "{{ effective_vnc_desktop_config.get('environment', 'kde') }}"
        vnc_desktop_display: "{{ effective_vnc_desktop_config.get('display', 1) }}"
        vnc_desktop_geometry: "{{ effective_vnc_desktop_config.get('geometry', '1920x1080') }}"
      tags: [vnc_desktop, vnc, desktop]

  tasks:
    - name: Validate custom role paths exist locally
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/roles/{{ item }}"
      loop: "{{ effective_custom_roles }}"
      register: custom_roles_stats
      delegate_to: localhost
      become: false
      when: effective_run_main_stack | bool
      tags: [custom]

    - name: Assert all custom roles exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isdir
        fail_msg: "Custom role '{{ item.item }}' not found under roles/."
      loop: "{{ custom_roles_stats.results | default([]) }}"
      when: effective_run_main_stack | bool
      tags: [custom]

    - name: Run custom local roles
      ansible.builtin.include_role:
        name: "{{ item }}"
      loop: "{{ effective_custom_roles }}"
      when: effective_run_main_stack | bool
      tags: [custom]
