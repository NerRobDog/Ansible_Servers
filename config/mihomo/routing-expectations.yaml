# Golden file: where each domain must route.
# Changing a route means changing this file in the same commit - the gate
# fails on any deviation, which is how an intended change is told apart
# from a regression. Seeded from an observed run on the captured template.
expectations:
- domain: www.youtube.com
  group: 📺 YouTube
- domain: chatgpt.com
  group: 🤖 ChatGPT и AI
- domain: claude.ai
  group: 🤖 ChatGPT и AI
- domain: x.com
  group: 🚫 Недоступные из РФ
- domain: instagram.com
  group: 📷 Instagram
- domain: discord.com
  group: 💬 Discord
- domain: api.telegram.org
  group: ➤ Telegram
- domain: soundcloud.com
  group: 🚫 Недоступные из РФ
- domain: yandex.ru
  group: ⚪🔵🔴 RU сайты
- domain: www.gstatic.com
  group: 🌍 Остальные сайты
- domain: ru.watchd0g.dev
  group: 🌍 Остальные сайты
# Subscription distribution. Every router fetches its OpenClash profile from
# here, so this entry guards the most load-bearing domain in the fleet. It
# currently falls through to the catch-all and therefore rides the proxy pool
# itself: if the pool breaks, a router cannot fetch the config that would fix
# it. Whether to break that circular dependency with an explicit DIRECT rule is
# open - see beads as-6y4. Recorded here as observed, not as desired.
- domain: no.watchd0g.dev
  group: 🌍 Остальные сайты
