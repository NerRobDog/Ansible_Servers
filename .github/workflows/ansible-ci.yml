---
name: ansible-ci

on:
  push:
  pull_request:

env:
  ANSIBLE_LOCAL_TEMP: .ansible/tmp
  ANSIBLE_REMOTE_TEMP: .ansible/tmp
  ANSIBLE_COLLECTIONS_PATH: .ansible/collections:/usr/share/ansible/collections
  PY_COLORS: "1"

jobs:
  lint-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Ansible collections
        run: ansible-galaxy collection install -p .ansible/collections -r requirements.yml

      - name: Prepare Ansible local temp
        run: mkdir -p .ansible/tmp

      - name: Fleet renderer contract tests
        run: python .github/scripts/test-render-fleet-runtime.py

      - name: OpenWrt fleet renderer contract tests
        run: python .github/scripts/test-render-openwrt-fleet-runtime.py

      - name: RemaWave panel sync contract tests
        run: python .github/scripts/test-remnawave-api-sync.py

      - name: mihomo candidate contract tests
        run: python .github/scripts/test-mihomo-candidate.py

      - name: mihomo lint contract tests
        run: python .github/scripts/test-mihomo-lint.py

      - name: mihomo routing contract tests
        run: python .github/scripts/test-mihomo-routing.py

      - name: bootstrap fresh-host contract tests
        run: python .github/scripts/test-bootstrap-fresh-host.py

      - name: warp_exit filter contract tests
        run: python .github/scripts/test-warp-exit-filter.py

      - name: warp_exit template contract test
        run: python .github/scripts/test-warp-exit-template.py

      - name: warp-probe contract tests
        run: bash .github/scripts/test-warp-probe.sh

      - name: Install promtool 2.55.0
        run: |
          curl -fsSL -o /tmp/prometheus.tar.gz \
            https://github.com/prometheus/prometheus/releases/download/v2.55.0/prometheus-2.55.0.linux-amd64.tar.gz
          echo "7a6b6d5ea003e8d59def294392c64e28338da627bf760cf268e788d6a8832a23  /tmp/prometheus.tar.gz" | sha256sum -c -
          tar -xzf /tmp/prometheus.tar.gz -C /tmp prometheus-2.55.0.linux-amd64/promtool
          sudo install -m 0755 /tmp/prometheus-2.55.0.linux-amd64/promtool /usr/local/bin/promtool

      - name: warp-exit alert rule tests
        run: bash .github/scripts/test-warp-alerts.sh

      - name: Syntax check playbook.yml
        run: ansible-playbook -i hosts.example.ini playbook.yml --syntax-check

      - name: warp_exit tag selection test
        run: bash .github/scripts/test-warp-exit-tags.sh

      - name: tailscale hostname contract test
        run: bash .github/scripts/test-tailscale-hostname.sh

      - name: ssh_lockdown effective sshd config test
        run: bash .github/scripts/test-ssh-lockdown.sh

      - name: Syntax check playbook-yusic-worker.yml
        run: ansible-playbook -i hosts.example.ini playbook-yusic-worker.yml --syntax-check

      - name: Syntax check playbook.openwrt.yml
        run: ansible-playbook -i hosts.example.ini playbook.openwrt.yml --syntax-check

      - name: ansible-lint
        run: ansible-lint playbook.yml playbook.openwrt.yml playbook-yusic-worker.yml roles

      - name: yamllint
        run: yamllint .

  molecule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Ansible collections
        run: ansible-galaxy collection install -p .ansible/collections -r requirements.yml

      - name: Prepare Ansible local temp
        run: mkdir -p .ansible/tmp

      - name: Run Molecule
        run: molecule test -s default
