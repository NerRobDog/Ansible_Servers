name: Push mihomo subscription template

# Durable-фикс маршрутизации в MIHOMO subscription-template Remnawave
# (панель ru.watchd0g.dev; роутеры OpenClash качают его как профиль Watchdog
# через домен раздачи no.watchd0g.dev). Правит ЖИВОЙ шаблон через API,
# секрет панели инжектится Actions и в клиентский контекст не попадает.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect (только GET) или apply (GET→правка YouTube→PATCH→verify)"
        type: choice
        required: true
        default: inspect
        options:
          - inspect
          - apply

jobs:
  push-template:
    runs-on: ubuntu-latest
    environment: Testing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet ruamel.yaml certifi

      - name: Run template push
        env:
          RW_PANEL_API_BASE_URL: ${{ vars.RW_PANEL_API_BASE_URL }}
          RW_PANEL_API_TOKEN: ${{ secrets.RW_PANEL_API_TOKEN }}
        run: python3 .github/scripts/push_mihomo_template.py --mode "${{ inputs.mode }}"

      - name: Upload live template artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-mihomo-template-${{ inputs.mode }}
          path: live-mihomo-template.yaml
          if-no-files-found: ignore
