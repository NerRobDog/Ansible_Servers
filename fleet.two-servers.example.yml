---
# Two-server fleet template: Germany + Netherlands.
# Stack: base + docker + remnawave_node + caddy_node + node_tuning + user_shell.
# Monitoring feature flags здесь выключены, потому что нет отдельного monitoring_stack host.
#
# Usage:
# 1) Fill placeholders below.
# 2) Base64-encode this YAML.
# 3) Save encoded string into GitHub Environment Secret RW_FLEET_CONFIG_B64.

defaults:
  ansible_port: 22
  deploy_user: deploy
  bootstrap:
    username: root
    password: "CHANGE_ME"
  features:
    feature_base: true
    feature_firewall: true
    feature_docker: true
    feature_remnawave_node: true
    feature_caddy_node: true
    feature_node_tuning: true
    feature_monitoring_agent: false
    feature_monitoring_stack: false
    feature_user_shell: true
  remnawave:
    # Empty = auto:
    # target_profile_name -> <host_alias>
    # inbound_tag -> VLESS_<HOST_ALIAS>
    # target_inbound_tags -> [inbound_tag]
    # reality_server_name -> caddy_domain
    # reality_short_id/reality_private_key -> deterministic generation
    node_secret_key: ""
    node_port: 3001
    caddy_domain: ""
    caddy_monitor_port: 8443
    ipv6_state: enabled
    caddy_tls_mode: public
    caddy_local_only: true
    caddy_tls_cert_file: ""
    caddy_tls_key_file: ""
    caddy_acme_ca: ""
    # panel_node_uuid: "00000000-0000-4000-8000-000000000001"
    # target_profile_name: "de_node"
    # inbound_tag: "VLESS_DE_NODE"
    # target_inbound_tags:
    #   - "VLESS_DE_NODE"
    reality_target: "127.0.0.1:8443"
    # reality_short_id: "c0d2ed6aa8460e20"
    # reality_private_key: "REPLACE_ME"
    # reality_server_name: "de-node.example.com"
  custom_roles: []
  yusic_worker:
    relay_host_alias: de_node
    image_repo: ghcr.io/OWNER/Yusic_bot/download-worker
    enabled: true
    arch: arm64
    tags:
      - provider:soundcloud
      - region:nl
      - cpu:low
    max_concurrent_jobs: 1
    network_mode: host
    redis_url: redis://100.64.0.10:6379/0
    cache_bot_token: CHANGE_ME_CACHE_BOT_TOKEN
    inline_cache_chat_id: "-1001234567890"
  monitoring:
    agent_bind_address: "0.0.0.0"
    agent_node_exporter_port: 9100
    agent_cadvisor_port: 8080
    agent_promtail_enabled: true
    agent_acl_enabled: false
    agent_acl_allowed_sources: []
    loki_push_url: ""
    labels:
      country: ""
      role: node
    stack_bind_address: "127.0.0.1"
    stack_loki_ingest_bind_address: "0.0.0.0"
    stack_loki_ingest_allowed_sources: []
    stack_retention_days: 7
    stack_grafana_admin_user: admin
    stack_grafana_admin_password: "CHANGE_ME_GRAFANA_ADMIN_PASSWORD"

hosts:
  de_node:
    ansible_host: "GERMANY_PUBLIC_IP"
    bootstrap:
      username: root
      password: "GERMANY_SERVER_PASSWORD"
    remnawave:
      node_secret_key: "GERMANY_REMNAWAVE_NODE_SECRET"
      node_port: 3001
      caddy_domain: "de-node.example.com"
      caddy_monitor_port: 8443
      ipv6_state: enabled
      caddy_tls_mode: public
      caddy_local_only: true
      # Optional: if empty, node name must match host alias (de_node).
      # panel_node_uuid: "GERMANY_PANEL_NODE_UUID"
      reality_target: "127.0.0.1:8443"
      # Optional (auto by host alias). Uncomment if you need explicit values:
      # target_profile_name: "de_node"
      # inbound_tag: "VLESS_DE_NODE"
      # target_inbound_tags:
      #   - "VLESS_DE_NODE"
      # reality_server_name: "de-node.example.com"
      # reality_short_id: "7642b35f5570246f"
      # reality_private_key: "REPLACE_ME"
    custom_roles: []
    monitoring:
      agent_bind_address: "0.0.0.0"
      agent_node_exporter_port: 9100
      agent_cadvisor_port: 8080
      agent_promtail_enabled: false
      labels:
        country: DE
        role: node
      # Включайте ACL, если scrape идёт только с фиксированных IP.
      agent_acl_enabled: false
      agent_acl_allowed_sources: []

  nl_node:
    ansible_host: "NETHERLANDS_PUBLIC_IP"
    bootstrap:
      username: root
      password: "NETHERLANDS_SERVER_PASSWORD"
    remnawave:
      node_secret_key: "NETHERLANDS_REMNAWAVE_NODE_SECRET"
      node_port: 3001
      caddy_domain: "nl-node.example.com"
      caddy_monitor_port: 8443
      ipv6_state: enabled
      caddy_tls_mode: public
      caddy_local_only: true
      # Optional: if empty, node name must match host alias (nl_node).
      # panel_node_uuid: "NETHERLANDS_PANEL_NODE_UUID"
      reality_target: "127.0.0.1:8443"
      # Optional (auto by host alias). Uncomment if you need explicit values:
      # target_profile_name: "nl_node"
      # inbound_tag: "VLESS_NL_NODE"
      # target_inbound_tags:
      #   - "VLESS_NL_NODE"
      # reality_server_name: "nl-node.example.com"
      # reality_short_id: "c0d2ed6aa8460e20"
      # reality_private_key: "REPLACE_ME"
    custom_roles: []
    monitoring:
      agent_bind_address: "0.0.0.0"
      agent_node_exporter_port: 9100
      agent_cadvisor_port: 8080
    monitoring:
      agent_bind_address: "0.0.0.0"
      agent_node_exporter_port: 9100
      agent_cadvisor_port: 8080
      agent_promtail_enabled: false
      labels:
        country: NL
        role: node
      # Пример строгого режима: scrape разрешён только с DE ноды.
      # agent_acl_enabled: true
      # agent_acl_allowed_sources:
      #   - "GERMANY_PUBLIC_IP/32"

workers:
  wrt_me:
    enabled: true
    arch: arm64
    ssh:
      host: 100.112.10.20
      port: 22
      user: root
    tags:
      - provider:soundcloud
      - region:nl
      - cpu:low
