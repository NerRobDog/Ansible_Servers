; Inventory for the yusic main stack (miniapp-api consumer).
;
; The host alias `polite` is resolved via ~/.ssh/config on the operator's
; machine (HostName 89.23.98.20, User root, IdentityFile ~/.ssh/polite_root).
; That keeps the public IP and the SSH key out of this repo.

[yusic_stack]
polite ansible_host=polite ansible_user=root ansible_ssh_common_args='-F ~/.ssh/config'
