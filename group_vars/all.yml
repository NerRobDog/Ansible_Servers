---
# User profile is disabled by default and can be enabled per-host in host_vars.
create_user: false
configure_root_zsh: true

# User defaults
new_user: ""
new_user_comment: ""
new_user_home: ""
new_user_groups:
  - wheel
  - docker
new_user_password_hash: null
new_user_authorized_keys: []
new_user_authorized_keys_exclusive: true
new_user_passwordless_sudo: false
new_user_shell: /bin/bash

# Zsh / OMZ defaults
zsh_theme: afowler
omz_plugins:
  - git
  - history
  - zsh-autosuggestions
  - zsh-syntax-highlighting
  - dirhistory
  - web-search
  - docker
  - extract
  - docker-compose
  - z
  - fzf
  - colored-man-pages
  - aliases
  - ansible
zsh_custom_plugins:
  - name: zsh-autosuggestions
    repo: https://github.com/zsh-users/zsh-autosuggestions.git
    version: master
  - name: zsh-syntax-highlighting
    repo: https://github.com/zsh-users/zsh-syntax-highlighting.git
    version: master
enable_thefuck: false

# Package defaults
base_packages:
  - git
  - curl
  - wget
  - nano
  - zsh
  - fzf
  - unzip
  - python3
  - python3-pip
  - rsync
  - sshpass
  - ansible-core
  - htop
  - net-tools
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
pipx_packages: []

# RemaWave node defaults (safe global defaults)
remnawave_node_enabled: false
remnawave_node_image: remnawave/node:latest
remnawave_node_port: 3001
remnawave_node_secret_key: ""
remnawave_node_install_path: /opt/remnanode
remnawave_node_log_dir: /var/log/remnanode
remnawave_node_network_mode: host
remnawave_node_cap_add:
  - NET_ADMIN
remnawave_node_manage_runtime: true

remnawave_api_enabled: true
remnawave_api_endpoint_template: ""
remnawave_fallback_json_env: RW_NODE_FALLBACK_JSON
remnawave_runtime_host_vars: {}

remnawave_caddy_enabled: true
remnawave_caddy_domain: ""
remnawave_caddy_monitor_port: 8443
remnawave_caddy_email: ""
remnawave_caddy_tls_mode: public
remnawave_caddy_tls_cert_file: ""
remnawave_caddy_tls_key_file: ""
remnawave_caddy_local_only: true
remnawave_caddy_acme_ca: ""

remnawave_bbr_enabled: true
remnawave_ipv6_state: enabled
remnawave_warp_enabled: false

# Fleet-driven feature flags
feature_base: true
feature_firewall: true
feature_docker: true
feature_tailscale: false
feature_remnawave_node: false
feature_caddy_node: false
feature_node_tuning: false
feature_monitoring_agent: false
feature_monitoring_stack: false
feature_user_shell: false
custom_roles: []
ssh_lockdown_enabled: false
fleet_mode: deploy
fleet_hosts: {}
openwrt_fleet_hosts: {}
openwrt_profile: prod_update

# OpenWrt fleet defaults
feature_openwrt_base: true
feature_openwrt_network_core: false
feature_openwrt_firewall_core: false
feature_openwrt_wan: false
feature_openwrt_wan_apply_in_prod: false
feature_openwrt_zerotier: true
feature_openwrt_passwall2: true
feature_openwrt_homeproxy_cleanup: true
feature_openwrt_docker_runtime: true
feature_openwrt_docker_stacks: true
feature_openwrt_monitoring_agent: true
feature_openwrt_ssh_lockdown: false

openwrt_base_packages:
  - ca-bundle
  - curl
  - jq
  - coreutils-timeout
  - openssh-sftp-server

openwrt_bootstrap_public_key: ""

openwrt_wan_enabled: true
openwrt_wan_proto: dhcp
openwrt_wan_device: eth0
openwrt_wan_ipaddr: ""
openwrt_wan_netmask: ""
openwrt_wan_gateway: ""
openwrt_wan_dns:
  - 9.9.9.9
  - 149.112.112.112
openwrt_wan_pppoe_username: ""
openwrt_wan_pppoe_password: ""
openwrt_wan_pppoe_ipv6: auto

openwrt_network_lan_device: br-lan
openwrt_network_lan_ipaddr: 192.168.1.1
openwrt_network_lan_netmask: 255.255.255.0
openwrt_network_lan_ip6assign: "60"
openwrt_network_ula_prefix: ""
openwrt_network_manage_wan_baseline: true

zerotier_enabled: true
zerotier_package: zerotier
zerotier_service_name: zerotier
zerotier_network_id: ""
zerotier_manage_secret: false
zerotier_secret: ""

passwall2_enabled: true
passwall2_feed_name: openwrt_kiddin9
passwall2_feed_url: "https://master.dl.sourceforge.net/project/openwrt-passwall-build/releases/packages-24.10/aarch64_cortex-a53/passwall2"
passwall2_dep_feed_name: openwrt_passwall2_deps
passwall2_dep_feed_url: "https://downloads.immortalwrt.org/releases/23.05.3/packages/aarch64_cortex-a53/packages"
passwall2_download_timeout: 20
passwall2_download_retries: 2
passwall2_subscribe_url: ""
passwall2_probe_url: https://www.gstatic.com/generate_204
passwall2_socks_port: 1070
passwall2_profile_overrides: {}
passwall2_acl_bypass_macs: []
passwall2_dns_provider: quad9
passwall2_geoip_url_v2ray: https://github.com/hydraponique/roscomvpn-geoip/releases/download/202510180601/geoip.dat
passwall2_geosite_url_v2ray: https://github.com/hydraponique/roscomvpn-geosite/releases/download/202510180849/geosite.dat
passwall2_geoip_url_singbox: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.db
passwall2_geosite_url_singbox: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.db
passwall2_packages:
  - luci-app-passwall2
  - sing-box
  - xray-core
  - chinadns-ng
  - dns2socks
  - ipt2socks
  - microsocks
  - naiveproxy

passwall2_dns_profiles:
  quad9:
    remote_dns_protocol: doh
    remote_dns: 9.9.9.9
    remote_dns_detour: direct
    remote_dns_doh: https://dns.quad9.net/dns-query
    dns_hosts:
      - dns.quad9.net 9.9.9.9
      - dns11.quad9.net 149.112.112.112

openwrt_homeproxy_cleanup_packages:
  - luci-app-homeproxy
  - homeproxy

openwrt_docker_manage_runtime: true
openwrt_docker_runtime_packages:
  - dockerd
  - docker
  - docker-compose
openwrt_docker_runtime_manage_daemon_config: false
openwrt_docker_runtime_daemon_config: {}
openwrt_docker_runtime_daemon_config_path: /etc/docker/daemon.json
openwrt_docker_compose_command: docker-compose
openwrt_docker_stacks: []

openwrt_firewall_allow_zerotier_ssh: true
openwrt_firewall_zerotier_src_cidr: 172.16.0.0/12

openwrt_monitoring_enabled: true
openwrt_node_exporter_port: 9100
openwrt_probe_interval_minutes: 1
openwrt_probe_timeout_seconds: 12
openwrt_probe_script_path: /usr/local/bin/openwrt-connectivity-probe.sh

openwrt_ssh_lockdown_enabled: false
openwrt_ssh_password_authentication: "off"
openwrt_ssh_root_password_authentication: "off"

openwrt_rollback_enabled: true
openwrt_rollback_timeout_minutes: 10
openwrt_rollback_reboot_on_restore: true
openwrt_rollback_snapshot_dir: /root/.ansible-rollback
openwrt_rollback_control_script: /usr/local/sbin/openwrt-rollback-guard
openwrt_rollback_managed_paths:
  - /etc/config/dropbear
  - /etc/config/network
  - /etc/dropbear/authorized_keys
  - /etc/config/zerotier
  - /etc/config/passwall2
  - /etc/config/homeproxy
  - /etc/config/prometheus-node-exporter-lua
  - /etc/crontabs/root
  - /usr/local/bin/openwrt-connectivity-probe.sh
  - /opt/docker-stacks
openwrt_rollback_managed_services:
  - dropbear
  - network
  - zerotier
  - passwall2
  - prometheus-node-exporter-lua
  - cron
  - dockerd

# Tailscale defaults (shared for server + OpenWrt role)
tailscale_enabled: true
tailscale_state: present
tailscale_auth_key_env: TAILSCALE_AUTH_KEY
tailscale_extra_args: []
tailscale_package: tailscale
tailscale_service_name: tailscaled
tailscale_openwrt_service_name: tailscale
tailscale_openwrt_prereq_packages: []

# Monitoring defaults
monitoring_agent_bind_address: "0.0.0.0"
monitoring_agent_node_exporter_port: 9100
monitoring_agent_cadvisor_port: 8080
monitoring_agent_enable_node_exporter: true
monitoring_agent_enable_cadvisor: true
monitoring_agent_manage_runtime: true
monitoring_agent_install_path: /opt/monitoring-agent

monitoring_stack_install_path: /opt/monitoring-stack
monitoring_stack_manage_runtime: true
monitoring_stack_retention_days: 7
monitoring_stack_grafana_admin_user: admin
monitoring_stack_grafana_admin_password: change_me
monitoring_stack_prometheus_port: 9090
monitoring_stack_alertmanager_port: 9093
monitoring_stack_grafana_port: 3000
monitoring_stack_loki_port: 3100
monitoring_stack_scrape_fleet_agents: true
monitoring_stack_scrape_openwrt_agents: true
